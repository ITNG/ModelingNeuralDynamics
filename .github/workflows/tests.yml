name: tests

on:
  push:
    branches: [main, develop_python, develop_brian]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: uv sync

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Run tests (fast)
        # Default addopts (-m 'not slow', see pyproject.toml) skips
        # MATLAB-comparison tests at setup time, without running their
        # simulation bodies -- keeps day-to-day CI fast. -n auto
        # (pytest-xdist, already a dev dependency) spreads tests across
        # runner cores.
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: uv run pytest tests/ -v -n auto

      - name: Run tests (full, release)
        # -m "" overrides the repo-default "-m 'not slow'" so
        # slow/MATLAB-comparison tests are collected here. They skip
        # themselves (no MATLAB license in CI) -- this still catches
        # import errors, syntax errors, and any test that doesn't depend
        # on MATLAB. Only run on version tags to keep normal CI fast.
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: uv run pytest tests/ -v -m "" -n auto
