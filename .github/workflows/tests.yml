name: tests

on:
  push:
    branches: [main, develop_python, develop_brian]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: uv sync

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Run tests
        # -m "" overrides the repo-default "-m 'not slow'" (see
        # pyproject.toml) so slow/MATLAB-comparison tests are still
        # collected here. They skip themselves (no MATLAB license in CI)
        # -- this still catches import errors, syntax errors, and any
        # test that doesn't depend on MATLAB.
        run: uv run pytest tests/ -v -m ""
